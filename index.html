<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="css/based.css" rel="stylesheet" type="text/css">
    <link href="css/post.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header class="site-header">
        <p class="name-head">Блог №415</p>
        <nav class="nav-head">
            <ul class="header-list">
                <li><a href="index.html">Главная</a></li>
                <li><a href="authors.html">Авторы</a></li>
                <li><a href="communities.html">Группы</a></li>
            </ul>
        </nav>
        <a href="login.html" class="profile-login">Вход</a>
        <div class="dropdown-profile">
            <span class="profile-button"></span>
            <div class="dropdown-background">
                <a href="profile.html" class="to-profile">Профиль</a>
                <a href="#" class="logout">Выйти</a>
            </div>
        </div>
    </header>
    <div class="start-div">
        <input type="submit" value="Написать пост" id="subButtPost">
    </div>
    <section class="filter">
        <div class="filter-header">
            <p>Фильтры</p>
        </div>  
        <div class="filter-content">
            <div class="filter-first-row">
                <div class="filter-name-search">
                    <label for="NameSearch">Поиск по имени автора</label>
                    <input type="text" id="NameSearch">
                </div>
                <div class="filter-tag-search">
                    <label for="tagSearcher">Поиск по тэгам</label>
                    <select multiple id="tagSearcher"></select>
                </div>
            </div>
            <div class="filter-others">
                <div class="div-date">
                    <label for="filter-date">Сортировать</label>
                    <select id="filter-date">
                        <option>По дате создание (сначала новые)</option>
                        <option>По дате создание (сначала старые)</option>
                    </select>
                </div>
                <div class="filter-time-read-start">
                    <label for="timeReadingStart">Время чтения от</label>
                    <input type="text" id="timeReadingStart">
                </div>
                <div class="filter-time-read-finish">
                    <label for="timeReadingFinish">Время чтения до</label>
                    <input type="text" id="timeReadingFinish">
                </div>
                <div class="filter-mine-groups">
                    <input type="checkbox" id="onlyMineGroups">
                    <label for="onlyMineGroups">Только мои группы</label>
                </div>
                <input type="submit" value="Применить" id="subButtAccept">
            </div>
        </div>
    </section>
    <div class="select-navigate">
        <ul class="select-nav">
            <li class="lower-than">&lt;</li>
            <li class="greater-than">&gt;</li>
        </ul>
        <div class="select-size">
            <label for="size-page">Число постов на странице</label>
            <select id="sizePage">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="25">25</option>
                <option value="50">50</option>
            </select>
        </div>
    </div>
    <footer class="site-footer">
        <p>&copy; 2022 - Блог №415</p>
    </footer>
    <script src="js/based.js"></script>
    <script src="js/Posts/post.js"></script>
</body>
</html>
