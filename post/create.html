<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../css/based.css" rel="stylesheet" type="text/css">
    <link href="../css/postCreate.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header class="site-header">
        <p class="name-head">Блог №415</p>
        <nav class="nav-head">
            <ul class="header-list">
                <li><a href="../index.html">Главная</a></li>
                <li><a href="../authors.html">Авторы</a></li>
                <li><a href="../communities.html">Группы</a></li>
            </ul>
        </nav>
        <a href="../login.html" class="profile-login">Вход</a>
        <div class="dropdown-profile">
            <span class="profile-button"></span>
            <div class="dropdown-background">
                <a href="../profile.html" class="to-profile">Профиль</a>
                <a href="#" class="logout">Выйти</a>
            </div>
        </div>
    </header>
    <main>
        <h1 class="create-post-header">Написать новый пост</h1>
        <form id="registrationForm">
            <p class="post-title">Название</p>
            <input type="text" id="titlePost">
            <p class="post-title">Время чтения</p>
            <input type="number" id="timeReading">
            <p class="post-title">Группа</p>
            <select id="groupChoose">
                <option id="firstGroupChoose">Без группы</option>
                <!--здесь будут все группы в которых состоит юзер-->
            </select>
            <p class="post-title">Тэги</p>
            <select id="tagReg" multiple>
                
            </select>
            <p class="post-title">Ссылка на картинку</p>
            <input type="text" id="imageReg">
            <p class="post-title">Текст</p>
            <input type="text" id="textReg">
            <h1 class="create-post-address">Адрес</h1>
            <p class="post-title">Субъект РФ</p>
            <select id="addressChoose">
                <option id="firstAddressChoose">Не выбран</option>
                <!--здесь будут все адреса-->
            </select>
            <input type="submit" value="Создать пост" id="subButtReg">
        </form>
    </main>
    <footer class="site-footer">
        <p>&copy; 2022 - Блог №415</p>
    </footer>
    <script src="../js/based.js"></script>
    <script src="../js/Posts/postCreate.js"></script>
</body>
</html>
